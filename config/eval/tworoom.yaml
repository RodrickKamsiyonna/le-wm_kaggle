defaults:
  - launcher: local
  - solver: gradient  # was: cem
  - _self_

world:
  env_name: swm/TwoRoom-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  history_size: 1
  frame_skip: 1

seed: 42
policy: random  # ckpt name or random

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

# Gradient-based solver config (replaces CEM)
gradient_solver:
  n_iter: 50
  lr: 0.05
  n_restarts: 4
  action_noise: 0.0
  action_bounds: null   # set to [-1.0, 1.0] if your action space is bounded

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: tworoom
  callables:
    - method: _set_state
      args:
        state:
          value: proprio
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_proprio

output:
  filename: tworoom_results.txt
